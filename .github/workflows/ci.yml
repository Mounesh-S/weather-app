name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js (optional, needed if you want to run npm scripts)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies (for tests or build)
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests if you have any
      - name: Run tests
        run: npm test --if-present

      # 5️⃣ Build frontend (optional)
      - name: Build frontend
        run: npm run build --if-present

      # 6️⃣ Run Docker Compose
      - name: Run Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose Up
        run: |
          docker-compose -f docker-compose.dev.yml up -d --build
          docker ps

      # 7️⃣ Optional: Tear down containers after workflow
      - name: Docker Compose Down
        run: docker-compose -f docker-compose.dev.yml down
